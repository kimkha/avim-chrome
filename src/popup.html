<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="stylesheet" href="styles/popup.css">
</head>
<body>
<header class="header">
	<img class="headerIcon" src="icons/icon48.png" alt="" width="20" height="20">
	<h1 class="headerTitle" id="txtTitle">Bảng điều khiển AVIM</h1>
</header>
<div id="mainScreen">
	<section class="section">
		<h2 class="sectionTitle" id="txtSel">Chọn một kiểu gõ:</h2>
		<div class="options">
			<label class="option"><input type="radio" name="method" id="auto"><span id="txtAuto">Kết hợp</span></label>
			<label class="option"><input type="radio" name="method" id="telex"><span id="txtTelex">Kiểu TELEX</span></label>
			<label class="option"><input type="radio" name="method" id="vni"><span id="txtVni">Kiểu VNI</span></label>
			<label class="option"><input type="radio" name="method" id="viqr"><span id="txtViqr">Kiểu VIQR</span></label>
			<label class="option"><input type="radio" name="method" id="viqrStar"><span id="txtViqrStar">Kiểu VIQR*</span></label>
			<label class="option optionOff"><input type="radio" name="method" id="off"><span id="txtOff">Tắt AVIM</span></label>
		</div>
	</section>
	<section class="section">
		<label class="switchRow">
			<span id="txtSpellCheck">Kiểm tra chính tả</span>
			<input type="checkbox" class="switch" id="spellCheck">
		</label>
		<div class="buttonRow">
			<button class="button" id="openShortcuts" type="button"><span id="txtOpenShortcuts">Phím tắt</span></button>
		</div>
	</section>
	<p class="tip"><b class="tipTitle" id="txtTips">Mẹo nhỏ:</b> <span id="txtTipsCtrl">Nhấn Ctrl 2 lần để bật/tắt nhanh.</span></p>
	<section class="section">
		<h2 class="sectionTitle" id="txtDemo">Gõ nhanh</h2>
		<textarea id="inputDemo" autofocus="autofocus" placeholder="Gõ nhanh tiếng Việt tại đây"></textarea>
		<div class="buttonRow">
			<button class="button buttonPrimary" id="demoCopy" type="button"><span id="txtDemoCopy">Copy</span></button>
			<button class="button" id="removeAccent" type="button"><span id="txtRemoveAccent">Đổi không dấu</span></button>
		</div>
	</section>
</div>
<div id="shortcutScreen" style="display:none;">
	<div class="screenHeader">
		<button class="button" id="backToMain" type="button"><span id="txtBack">← Trở về</span></button>
		<h2 class="screenTitle" id="txtShortcuts">Phím tắt</h2>
	</div>
	<label class="switchRow">
		<span id="txtShortcutsOn">Bật phím tắt</span>
		<input type="checkbox" class="switch" id="shortcutsOn">
	</label>
	<section class="section">
		<div id="shortcutList"></div>
		<div class="buttonRow">
			<button class="button" id="addShortcut" type="button"><span id="txtAddShortcut">Thêm phím tắt</span></button>
		</div>
	</section>
	<div class="buttonRow">
		<button class="button buttonPrimary" id="saveShortcuts" type="button"><span id="txtSaveShortcuts">Lưu phím tắt</span></button>
	</div>
</div>
	<script src="scripts/avim-ext.js"></script>
	<script src="chrome/popup.js"></script>
</body>
</html>
