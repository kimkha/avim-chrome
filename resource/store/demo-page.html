<!DOCTYPE html>
<!-- Neutral stand-in page for store screenshots. Deliberately unbranded: screenshots that mock a
     real product's UI risk being rejected during Chrome Web Store review. -->
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<title>Ghi chú</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font: 15px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			color: #202124;
			background: #f6f7fb;
		}
		.bar {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 14px 24px;
			background: #fff;
			border-bottom: 1px solid #e4e6ef;
		}
		.dot { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #7b6cd9, #4f3fb0); }
		.bar strong { font-size: 15px; font-weight: 600; }
		.bar .spacer { flex: 1; }
		.bar .chip { font-size: 12px; color: #5f6368; background: #f1f3f9; padding: 4px 10px; border-radius: 20px; }
		.wrap { max-width: 720px; margin: 0 auto; padding: 28px 24px; }
		.card {
			background: #fff;
			border: 1px solid #e4e6ef;
			border-radius: 12px;
			padding: 22px;
			box-shadow: 0 1px 2px rgba(16, 20, 60, .05);
		}
		h1 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
		.sub { margin: 0 0 20px; color: #5f6368; font-size: 13px; }
		label { display: block; font-size: 12px; font-weight: 600; color: #3c4043; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .4px; }
		input[type=text], textarea {
			width: 100%;
			font: inherit;
			padding: 11px 13px;
			border: 1px solid #d3d6e3;
			border-radius: 8px;
			background: #fff;
			color: #202124;
		}
		input[type=text]:focus, textarea:focus { outline: 2px solid #6b5ce0; outline-offset: -1px; border-color: #6b5ce0; }
		textarea { height: 132px; resize: none; line-height: 1.6; }
		.row { margin-bottom: 18px; }
		.actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
		button {
			font: inherit;
			font-weight: 600;
			padding: 9px 20px;
			border: 0;
			border-radius: 8px;
			background: #5646c8;
			color: #fff;
		}
		button.ghost { background: #f1f3f9; color: #3c4043; }
		.note { font-size: 12px; color: #80868b; margin-left: auto; }
	</style>
</head>
<body>
	<div class="bar">
		<div class="dot"></div>
		<strong>Ghi chú</strong>
		<div class="spacer"></div>
		<div class="chip">Đã lưu</div>
	</div>
	<div class="wrap">
		<div class="card">
			<h1>Soạn ghi chú mới</h1>
			<p class="sub">Mọi khung nhập liệu trên trang đều gõ được tiếng Việt.</p>
			<div class="row">
				<label for="title">Tiêu đề</label>
				<input type="text" id="title" value="">
			</div>
			<div class="row">
				<label for="body">Nội dung</label>
				<textarea id="body"></textarea>
			</div>
			<div class="actions">
				<button type="button">Lưu ghi chú</button>
				<button type="button" class="ghost">Huỷ</button>
				<span class="note">Tự động lưu</span>
			</div>
		</div>
	</div>
</body>
</html>
