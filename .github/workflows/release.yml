name: Release

on:
  push:
    tags: ['v*']
  # Lets a failed publish be re-run against a tag that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.10.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          manifest=$(node -p "require('./src/manifest.json').version")
          # The zip is named from the manifest, so a tag that disagrees would publish an asset
          # whose filename contradicts its own tag.
          if [ "$tag" != "v$manifest" ]; then
            echo "::error::tag $tag does not match src/manifest.json version $manifest (expected v$manifest)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test

      - run: npx playwright install --with-deps chromium
      - run: yarn build
      # The only check that exercises the minified build/ tree that actually ships.
      - run: yarn test:browser

      - name: Extract release notes
        run: |
          version='${{ steps.version.outputs.version }}'
          awk -v v="$version" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat /tmp/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: dist/avim-chrome-${{ steps.version.outputs.version }}.zip
        run: |
          # Idempotent so the workflow_dispatch re-run can repair a release that already exists;
          # `gh release create` alone fails outright when the tag has been published before.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/notes.md
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --verify-tag
          fi
